name: byabsha_360_demo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  provider: ^6.1.5+1
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/byabsha_360_logo.png
  adaptive_icon_background: "#F5FFFA"
  adaptive_icon_foreground: assets/branding/byabsha_360_logo.png

flutter:
  uses-material-design: true
